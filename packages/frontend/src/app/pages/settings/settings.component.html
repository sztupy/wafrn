<section class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'menu.settings.title' | translate }}</h2>
  <p>Routes</p>
  <ul>
    @for (group of groups; track $index) {
      <li>
        <a [routerLink]="group.key">{{ group.title | translate }}</a>
      </li>
    }
  </ul>
  <p>The data:</p>
  <pre>{{ values | json }}</pre>
</section>
<router-outlet></router-outlet>
