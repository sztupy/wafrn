<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'menu.settings.title' | translate }}</h2>
</div>
<div class="mx-3 lg:mx-4 grid wafrn-container-wide">
  <section class="col-12 md:col-4 md:max-w-20rem">
    <mat-nav-list>
      @for (group of groups; track $index) {
        <a mat-list-item [routerLink]="group.key" routerLinkActive="page-active" class="">
          @if (group.icon) {
            <fa-icon matListItemIcon [icon]="group.icon" size="sm" [fixedWidth]="true"></fa-icon>
          }
          <div matListItemTitle>{{ group.title | translate }}</div>
        </a>
      }
    </mat-nav-list>
    <hr />
    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>[DEBUGGING] The data:</mat-panel-title>
      </mat-expansion-panel-header>
      <pre>{{ values | json }}</pre>
    </mat-expansion-panel>
  </section>
  <section class="col">
    <router-outlet></router-outlet>
  </section>
</div>
