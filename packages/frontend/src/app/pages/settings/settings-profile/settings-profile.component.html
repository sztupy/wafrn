<mat-card class="mb-4 overflow-hidden settings-blog-header">
  <div
    class="h-8rem mb-3 p-3 flex justify-content-end settings-blog-header-image"
    [style.background-image]="'url(' + headerUrl() + ')'"
  >
    <div style="color: red; background: aliceblue">change header image button</div>
  </div>
  <div class="flex gap-3 justify-content-between">
    <img [src]="avatarUrl()" alt="user avatar" class="settings-blog-avatar-image" />
    <div style="color: red; background: aliceblue">change avatar button</div>
  </div>
</mat-card>
<app-setting-entry [setting]="data.name"></app-setting-entry>
<app-setting-entry [setting]="data.description"></app-setting-entry>

<h2 class="setting-header">{{ 'settings.header.fediAttachments' | translate }}</h2>
<section>
  @for (attachment of fediAttachments; track $index) {
    <div class="flex align-items-center gap-3 fedi-attachment-list">
      <mat-form-field class="fedi-attachment" floatLabel="always">
        <mat-label>{{ 'settings.fediPropertyKey' | translate }}</mat-label>
        <input
          matNativeControl
          required
          spellcheck="false"
          [value]="fediAttachments[$index].name"
          (input)="updateFediAttachment($index, 'name', $event)"
        />
      </mat-form-field>
      <mat-form-field class="fedi-attachment" floatLabel="always">
        <mat-label>{{ 'settings.fediPropertyValue' | translate }}</mat-label>
        <input
          matNativeControl
          required
          spellcheck="false"
          [value]="fediAttachments[$index].value"
          (input)="updateFediAttachment($index, 'value', $event)"
        />
      </mat-form-field>
      <button (click)="removeFediAttachment($index)" mat-button class="mb-4 mat-circle-button remove-fedi-attachment">
        <fa-icon [icon]="removeIcon" class="m-1"></fa-icon>
      </button>
    </div>
  }
  <button (click)="addFediAttachment()" mat-stroked-button class="fedi-attachment-add-button">
    {{ 'settings.addFediAttachment' | translate }}
    <fa-icon [icon]="addIcon" [fixedWidth]="true"></fa-icon>
  </button>
</section>
