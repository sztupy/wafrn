@if (group) {
  <mat-card class="mb-4 overflow-hidden settings-blog-header">
    <div class="h-8rem mb-3 settings-blog-header-image" [style.background-image]="'url(' + headerUrl() + ')'"></div>
    <div><img [src]="avatarUrl()" alt="user avatar" class="settings-blog-avatar-image" /></div>
  </mat-card>
  <app-setting-entry [setting]="group.values.name"></app-setting-entry>
  <app-setting-entry [setting]="group.values.description"></app-setting-entry>
  <hr />
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>[DEBUG]: all given values</mat-panel-title>
    </mat-expansion-panel-header>
    @for (setting of group.values | KeyValue; track $index) {
      <app-setting-entry [setting]="setting.value"></app-setting-entry>
    }
  </mat-expansion-panel>
}
