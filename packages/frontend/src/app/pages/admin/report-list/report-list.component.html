<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'menu.admin.reports' | translate }}</h2>
</div>

<mat-card class="p-3 mb-6 lg:mx-4 wafrn-container-wide">
  <mat-form-field class="w-full">
    <mat-label>Reports Filter</mat-label>
    <input matInput class="w-full" [(ngModel)]="dataSource.filter" />
  </mat-form-field>

  <div class="w-full overflow-x-auto">
    <table mat-table matSort [dataSource]="dataSource" class="w-max">
      <ng-container matColumnDef="user">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let element">
          <a [routerLink]="'/blog/' + element.user.url">
            <app-avatar-small [user]="element.user"></app-avatar-small>
            {{ element.user.url }}</a
          >
        </td>
      </ng-container>
      <ng-container matColumnDef="reportedUser">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Reported user</th>
        <td mat-cell *matCellDef="let element">
          <a
            [routerLink]="element.post ? ['/fediverse/post/' + element.post.id] : ['/blog/' + element.reportedUser.url]"
          >
            <app-avatar-small [user]="element.reportedUser"></app-avatar-small>
            {{ element.reportedUser.url }}</a
          >
        </td>
      </ng-container>
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let element">{{ element.severity }} ({{ mapReport(element.severity) }})</td>
      </ng-container>
      <ng-container matColumnDef="report">
        <th mat-header-cell *matHeaderCellDef>Report</th>
        <td mat-cell *matCellDef="let element">
          <div class="report-description">{{ element.description }}</div>
        </td>
      </ng-container>
      <ng-container matColumnDef="solved">
        <th mat-header-cell *matHeaderCellDef>Solved</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [disabled]="true" [checked]="element.resolved"></mat-checkbox>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          @if (!element.resolved) {
            <div class="flex gap-2">
              <button mat-flat-button class="primary" (click)="ignore(element.id)">Ignore report</button>
              <button mat-flat-button class="warn" (click)="forceNSFW(element.reportedUser.id)">
                Mark user as NSFW
              </button>
              <button mat-flat-button class="warn" (click)="ban(element)">Ban user</button>
            </div>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
  >
  </mat-paginator>
</mat-card>
