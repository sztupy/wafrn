<mat-card class="pb-3 mb-6 lg:mx-4 mat-card-higher wafrn-container">
  <mat-card-header class="pb-3 wafrn-container-header">
    <mat-card-title class="flex gap-2"
      ><fa-icon [icon]="faArrowRightToBracket"></fa-icon
      ><span class="font-medium">{{ 'login.title' | translate }}</span></mat-card-title
    >
  </mat-card-header>
  <section class="my-6 mx-3 text-center">
    <h1 class="text-5xl">{{ 'login.welcomeBack' | translate }}</h1>
    <p>{{ 'login.mfaNextStep' | translate }}</p>
  </section>

  <form class="px-3" [formGroup]="loginMfaForm" (ngSubmit)="onSubmit()">
    <p class="font-medium line-height-3">{{ 'login.mfaTokenEnter' | translate }}</p>

    <mat-form-field class="w-full mat-form-field-no-padding">
      <mat-label>{{ 'login.mfaToken' | translate }}</mat-label>
      <input formControlName="token" name="token" type="token" matInput />
    </mat-form-field>

    <div class="flex">
      <button
        [disabled]="!loginMfaForm.valid"
        mat-flat-button
        color="primary"
        extended
        class="w-full border-round-md mt-4"
      >
        {{ 'login.loginButton' | translate }}
        <fa-icon [icon]="submitIcon"></fa-icon>
      </button>
      @if (loginMfaForm.disabled) {
        <mat-spinner diameter="24" class="mt-5 mx-3"></mat-spinner>
      }
    </div>
  </form>
</mat-card>
