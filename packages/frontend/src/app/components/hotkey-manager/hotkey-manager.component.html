<button
  (click)="openHotkeyListDialog()"
  mat-button
  class="mat-circle-button hotkey-help-icon"
  [ngClass]="{
    'hotkey-help-icon-default': !(horizontalMenu && !topToolbar),
    'hotkey-help-icon-up ': horizontalMenu && !topToolbar
  }"
  aria-label="keyboard shortcuts"
  matTooltip="Keyboard
  Shortcuts"
>
  <fa-icon [icon]="keyboardIcon" />
</button>
