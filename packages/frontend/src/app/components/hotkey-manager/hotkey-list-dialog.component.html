<h1 class="shortcut-list-title">{{ 'keyboard-shortcuts.keyboardShortcuts' | translate }}</h1>
<dl class="shortcut-list">
  @for (shortcut of defaultKeybinds | keyvalue: null; track $index) {
    <div>
      <dt>{{ 'keyboard-shortcuts.' + shortcut.key | translate }}</dt>
      <dd>
        <kbd>
          <button
            (click)="setKeybind(shortcut.key)"
            class="set-keybind"
            [class.changing]="changingKey === shortcut.key"
            [class.overlapping]="isOverlapping(mapping[shortcut.key])"
            mat-flat-button
          >
            {{ getKeybind(shortcut.key) }}
          </button>
        </kbd>
        <button
          (click)="resetKeybind(shortcut.key)"
          class="mat-circle-button reset-keybind"
          mat-button
          [disabled]="shortcut.value === mapping[shortcut.key]"
        >
          <fa-icon [icon]="undoIcon" />
        </button>
      </dd>
    </div>
  }
</dl>
