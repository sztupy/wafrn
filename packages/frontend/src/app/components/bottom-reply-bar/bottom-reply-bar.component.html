<div class="flex flex-wrap row-gap-2 justify-content-between">
  <div class="flex align-items-center">
    @if (notes) {
      <p class="m-0 text-sm">
        <a class="subtle-link notes-link" mat-stroked-button [postLink]="fragment()"
          ><b>{{ notes }}</b> notes</a
        >
      </p>
    } @else {
      <p class="m-0 text-sm">
        <a [postLink]="fragment()" class="subtle-link notes-link">View thread</a>
      </p>
    }
  </div>
  <app-post-action-buttons [fragment]="fragment()" settingKey="postReplyBarOrder"></app-post-action-buttons>
</div>
